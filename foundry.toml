[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.default.fuzz]
runs = 1000
