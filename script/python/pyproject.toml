[project]
name = "eip7702-e2e"
version = "0.1.0"
description = "EIP-7702 Minimal Batch Executor — Python E2E tests"
requires-python = ">=3.12"
dependencies = [
    "web3>=7.0.0",
    "eth-account>=0.13.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "rlp>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = [
    "artifacts",
    "calls",
    "config",
    "hash",
    "providers",
    "signers",
    "tx",
    "userop",
]
